# The index is a build artifact that gets committed, so CI verifies it rather
# than writing it. A job that regenerated index/index.md and pushed to main
# would need a protected-branch bypass, would add a commit per merge, and would
# fail on a non-fast-forward whenever two pull requests land close together.
# Authors regenerate it instead — `jerry hooks install` does it on commit.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned, never @latest: a floating version turns unrelated pull requests
      # red. Downloads the released binary and verifies it against the
      # published checksums.txt — no Go toolchain, no module proxy.
      - name: install jerry
        run: |
          set -eu
          JERRY_VERSION=__JERRY_VERSION__
          case "$(uname -s)" in
            Linux) JERRY_OS=linux ;;
            Darwin) JERRY_OS=darwin ;;
            *)
              echo "jerry install: unsupported OS $(uname -s) -- released binaries cover linux and darwin. See CONTRIBUTING.md for a source install." >&2
              exit 1
              ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) JERRY_ARCH=amd64 ;;
            aarch64|arm64) JERRY_ARCH=arm64 ;;
            *)
              echo "jerry install: unsupported architecture $(uname -m) -- released binaries cover amd64 and arm64. See CONTRIBUTING.md for a source install." >&2
              exit 1
              ;;
          esac
          if [ "$JERRY_VERSION" = "latest" ]; then
            JERRY_VERSION=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/codcod/jerry/releases/latest | sed 's#.*/tag/##')
          fi
          ARCHIVE="jerry_${JERRY_VERSION#v}_${JERRY_OS}_${JERRY_ARCH}.tar.gz"
          BASE_URL="https://github.com/codcod/jerry/releases/download/${JERRY_VERSION}"
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/$ARCHIVE" "$BASE_URL/$ARCHIVE" || {
            echo "jerry install: no release asset $ARCHIVE at tag $JERRY_VERSION ($JERRY_OS/$JERRY_ARCH). See CONTRIBUTING.md for a source install." >&2
            exit 1
          }
          curl -fsSL -o "$TMP/checksums.txt" "$BASE_URL/checksums.txt" || {
            echo "jerry install: no checksums.txt at tag $JERRY_VERSION. See CONTRIBUTING.md for a source install." >&2
            exit 1
          }
          ( cd "$TMP" && grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c - )
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          echo "$TMP" >> "$GITHUB_PATH"
      - name: validate
        run: jerry validate
      - name: check index
        run: jerry index --check
